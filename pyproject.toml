[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytmpmail"
version = "0.3.0"
description = "A single interface for working with temporary email services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "maxrt" }
]
keywords = ["tempmail", "temp-mail", "temp-mail-api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha"
]
dependencies = [
    "requests"
]

[project.urls]
Homepage = "https://github.com/maxrt101/tmpmail"
Repository = "https://github.com/maxrt101/tmpmail"
Issues = "https://github.com/maxrt101/tmpmail/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tmpmail"]
